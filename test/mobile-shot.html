<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Mobile Shot</title>
<style>
  html,body{margin:0;background:#05070c;font:12px ui-monospace,Consolas,monospace;color:#8fa3bd}
  .row{display:flex;gap:18px;padding:14px;align-items:flex-start}
  .cell{display:flex;flex-direction:column;gap:6px}
  .cap{color:#5f7a96}
  iframe{border:1px solid rgba(255,255,255,.14);border-radius:8px;background:#05070c;display:block}
</style>
</head>
<body>
<!--
  headless Chrome 在 Windows 上有 500px 的最小窗口宽度，
  直接 --window-size=390 拿到的是「500px 布局裁到 390」，不是真实手机视口。
  用固定宽度的 iframe 才能得到真正的 390 / 360 布局视口。
-->
<div class="row">
  <div class="cell"><span class="cap">390 x 844 竖屏 —— 应显示「请横屏」</span>
    <iframe src="../index.html?mobile=1&noanim=1" width="390" height="844"></iframe></div>
  <div class="cell"><span class="cap">844 x 390 横屏 · 游戏内 —— 顶栏应消失</span>
    <iframe src="../index.html?mobile=1&noanim=1&screen=game" width="844" height="390"></iframe></div>
</div>
<div id="probe">probing…</div>
<script>
/* 把每个 iframe 里的诊断标题汇总到本页，便于 dump-dom 读取。
   需要 --allow-file-access-from-files 才能跨 file:// iframe 读 contentDocument。 */
setTimeout(function () {
  const out = [];
  document.querySelectorAll('iframe').forEach(function (f, i) {
    try {
      const doc = f.contentDocument, win = f.contentWindow;
      const sc = doc.querySelector('.screen.is-active');
      const pause = doc.getElementById('btnPause');
      const title = doc.getElementById('gameTitle');
      const keys = doc.getElementById('gameKeys');
      const cs = win.getComputedStyle(pause);
      const rect = sc.getBoundingClientRect();
      out.push('#' + i +
        ' vw=' + doc.documentElement.clientWidth +
        ' vh=' + doc.documentElement.clientHeight +
        ' 屏=' + sc.id +
        ' 内容高=' + sc.scrollHeight + ' 视口高=' + sc.clientHeight +
        ' 需滚动=' + (sc.scrollHeight > sc.clientHeight + 1) +
        ' | 暂停键=' + Math.round(pause.getBoundingClientRect().width) + 'x' +
          Math.round(pause.getBoundingClientRect().height) +
          ' 透明度=' + cs.opacity +
        ' | 曲名HUD=' + win.getComputedStyle(title).display +
        ' 按键HUD=' + win.getComputedStyle(keys).display +
        ' | 内容列宽=' + Math.round(rect.width) +
        ' 左=' + Math.round(rect.left) + ' 右=' + Math.round(rect.right));
    } catch (e) { out.push('#' + i + ' 读不到: ' + e.message); }
  });
  document.getElementById('probe').textContent = out.join('\n');
  document.title = 'PROBE ' + out.join(' ;; ');
}, 3500);
</script></body>
</html>
